services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: economic_express
      POSTGRES_USER: economic_express
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U economic_express"]
      interval: 5s
      retries: 10
volumes:
  postgres:
